---
# --- macOS (local smoke path) ---
- name: Ensure Stella.app is present (macOS)
  ansible.builtin.stat:
    path: "{{ stella_app }}"
  register: stella_app_stat
  when: ansible_os_family == "Darwin"
  tags: [stella, install]

- name: Fail clearly when Stella.app is missing
  ansible.builtin.fail:
    msg: >-
      Stella.app not found at {{ stella_app }}.
      Install Stella for macOS, then re-run configure.
  when:
    - ansible_os_family == "Darwin"
    - not stella_app_stat.stat.exists
  tags: [stella, install]

- name: Ensure ~/.local/bin exists (macOS)
  ansible.builtin.file:
    path: "{{ local_bin }}"
    state: directory
    mode: "0755"
  when: ansible_os_family == "Darwin"
  tags: [stella, install]

- name: Symlink stella onto PATH via ~/.local/bin (macOS)
  ansible.builtin.file:
    src: "{{ stella_bin }}"
    dest: "{{ local_bin }}/stella"
    state: link
    force: true
  when:
    - ansible_os_family == "Darwin"
    - stella_app_stat.stat.exists | default(false)
  tags: [stella, install]

- name: Ensure atari-kickoff config directory exists (macOS)
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/atari-kickoff"
    state: directory
    mode: "0755"
  when: ansible_os_family == "Darwin"
  tags: [stella, keymap]

- name: Copy project keymap intent file (macOS)
  ansible.builtin.copy:
    src: "{{ repo_root }}/config/keymap.yaml"
    dest: "{{ ansible_env.HOME }}/.config/atari-kickoff/keymap.yaml"
    mode: "0644"
  when: ansible_os_family == "Darwin"
  tags: [stella, keymap]

- name: Ensure Stella settings directory exists (macOS)
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/Library/Application Support/Stella"
    state: directory
    mode: "0755"
  when: ansible_os_family == "Darwin"
  tags: [stella, keymap]

- name: Apply Stella joystick keymap from repo snapshot (macOS)
  ansible.builtin.command:
    cmd: python3 "{{ repo_root }}/scripts/apply_stella_keymap.py"
  register: keymap_apply
  changed_when: "'PASS: wrote keymap_joy' in keymap_apply.stdout"
  when: ansible_os_family == "Darwin"
  tags: [stella, keymap]

- name: Show keymap apply result (macOS)
  ansible.builtin.debug:
    var: keymap_apply.stdout_lines
  when:
    - ansible_os_family == "Darwin"
    - keymap_apply is defined
  tags: [stella, keymap]

# --- Amazon Linux / remote EC2 ---
- name: Install Stella dependencies (Amazon Linux)
  ansible.builtin.dnf:
    name:
      - tar
      - gzip
      - which
      - libX11
      - libXext
      - libXrandr
      - libXcursor
      - mesa-libGL
      - alsa-lib
      - python3
    state: present
  become: true
  when: ansible_os_family == "RedHat"
  tags: [stella, install]

- name: Check whether stella is already on PATH (Linux)
  ansible.builtin.command: which stella
  register: stella_which
  changed_when: false
  failed_when: false
  when: ansible_os_family == "RedHat"
  tags: [stella, install]

- name: Install Stella via package manager when available (Linux)
  ansible.builtin.dnf:
    name: stella
    state: present
  become: true
  register: stella_pkg
  failed_when: false
  when:
    - ansible_os_family == "RedHat"
    - stella_which.rc != 0
  tags: [stella, install]

- name: Report Stella package install status (Linux)
  ansible.builtin.debug:
    msg: >-
      Stella package result: {{ stella_pkg.msg | default(stella_pkg.rc | default('ok')) }}.
      Falling back to Flatpak because Stella is not on PATH.
  when:
    - ansible_os_family == "RedHat"
    - stella_pkg is defined
  tags: [stella, install]

- name: Install Flatpak (Linux fallback)
  ansible.builtin.dnf:
    name: flatpak
    state: present
  become: true
  when:
    - ansible_os_family == "RedHat"
    - stella_which.rc != 0
  tags: [stella, install]

- name: Add Flathub remote when missing (Linux fallback)
  ansible.builtin.command:
    cmd: flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
  become: true
  changed_when: false
  when:
    - ansible_os_family == "RedHat"
    - stella_which.rc != 0
  tags: [stella, install]

- name: Install Stella from Flathub (Linux fallback)
  ansible.builtin.command:
    cmd: flatpak install -y flathub io.github.stella_emu.Stella
  become: true
  when:
    - ansible_os_family == "RedHat"
    - stella_which.rc != 0
  tags: [stella, install]

- name: Verify Stella Flatpak is installed (Linux fallback)
  ansible.builtin.command:
    cmd: flatpak list --app --columns=application,name
  register: stella_flatpak_list
  changed_when: false
  when:
    - ansible_os_family == "RedHat"
    - stella_which.rc != 0
  tags: [stella, install]

- name: Show Stella Flatpak installation (Linux fallback)
  ansible.builtin.debug:
    var: stella_flatpak_list.stdout_lines
  when:
    - ansible_os_family == "RedHat"
    - stella_flatpak_list is defined
  tags: [stella, install]

- name: Ensure remote config directory exists (Linux)
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/atari-kickoff"
    state: directory
    mode: "0755"
  when: ansible_os_family == "RedHat"
  tags: [stella, keymap]

- name: Copy keymap intent file to remote host (Linux)
  ansible.builtin.copy:
    src: "{{ repo_root }}/config/keymap.yaml"
    dest: "{{ ansible_env.HOME }}/.config/atari-kickoff/keymap.yaml"
    mode: "0644"
  when: ansible_os_family == "RedHat"
  tags: [stella, keymap]

- name: Copy Stella keymap snapshot to remote host (Linux)
  ansible.builtin.copy:
    src: "{{ repo_root }}/config/stella_keymap_joy.json"
    dest: "{{ ansible_env.HOME }}/.config/atari-kickoff/stella_keymap_joy.json"
    mode: "0644"
  when: ansible_os_family == "RedHat"
  tags: [stella, keymap]

- name: Ensure python3 is present for keymap apply (Linux)
  ansible.builtin.dnf:
    name: python3
    state: present
  become: true
  when: ansible_os_family == "RedHat"
  tags: [stella, keymap]

- name: Install keymap apply script on remote host (Linux)
  ansible.builtin.copy:
    src: "{{ repo_root }}/scripts/apply_stella_keymap.py"
    dest: "{{ ansible_env.HOME }}/.config/atari-kickoff/apply_stella_keymap.py"
    mode: "0755"
  when: ansible_os_family == "RedHat"
  tags: [stella, keymap]

- name: Apply Stella joystick keymap into Flatpak settings (Linux)
  ansible.builtin.command:
    cmd: >-
      python3 {{ ansible_env.HOME }}/.config/atari-kickoff/apply_stella_keymap.py
      --target flatpak
      --flatpak-id {{ stella_flatpak_id }}
      --json {{ ansible_env.HOME }}/.config/atari-kickoff/stella_keymap_joy.json
  register: keymap_apply_linux
  changed_when: >-
    ('PASS: wrote keymap_joy' in keymap_apply_linux.stdout)
    or ('PASS: updated event_ver' in keymap_apply_linux.stdout)
    or ('PASS: updated user_version' in keymap_apply_linux.stdout)
  when: ansible_os_family == "RedHat"
  tags: [stella, keymap]

- name: Restore SELinux context on Flatpak Stella config (Linux)
  ansible.builtin.command:
    cmd: >-
      restorecon -RFv
      {{ ansible_env.HOME }}/.var/app/{{ stella_flatpak_id }}/config/stella
  register: stella_restorecon
  changed_when: "'Relabeled' in (stella_restorecon.stdout | default(''))"
  failed_when: false
  when: ansible_os_family == "RedHat"
  tags: [stella, keymap]

- name: Show Flatpak keymap apply result (Linux)
  ansible.builtin.debug:
    var: keymap_apply_linux.stdout_lines
  when:
    - ansible_os_family == "RedHat"
    - keymap_apply_linux is defined
  tags: [stella, keymap]

# --- Linux VNC / remote desktop (TigerVNC + metacity) ---
- name: Install minimal desktop stack for VNC (Linux)
  ansible.builtin.dnf:
    name:
      - tigervnc-server
      - dbus-x11
      - xterm
      - dejavu-sans-fonts
      - xorg-x11-xauth
      - xorg-x11-server-utils
      - metacity
    state: present
    install_weak_deps: false
  become: true
  when: ansible_os_family == "RedHat"
  tags: [stella, vnc]

# pipewire-pulseaudio provides pulseaudio-daemon and conflicts with the
# pulseaudio package. Do not install the pulseaudio daemon here.
- name: Install PipeWire audio stack for VNC (Linux)
  ansible.builtin.dnf:
    name:
      - pipewire
      - pipewire-pulseaudio
      - pipewire-utils
      - wireplumber
      - pulseaudio-utils
    state: present
    install_weak_deps: false
  become: true
  when: ansible_os_family == "RedHat"
  tags: [stella, vnc, audio]

- name: Install Stella VNC session launcher
  ansible.builtin.copy:
    src: stella-vnc-session.sh
    dest: /usr/local/bin/stella-vnc-session
    mode: "0755"
    owner: root
    group: root
  become: true
  when: ansible_os_family == "RedHat"
  tags: [stella, vnc]

- name: Install Flatpak Stella launcher for TigerVNC (Linux)
  ansible.builtin.copy:
    src: stella-flatpak
    dest: /usr/local/bin/stella-flatpak
    mode: "0755"
    owner: root
    group: root
  become: true
  when: ansible_os_family == "RedHat"
  tags: [stella, vnc, audio]

- name: Install Stella PipeWire sink setup script (Linux)
  ansible.builtin.copy:
    src: stella-audio-setup
    dest: /usr/local/bin/stella-audio-setup
    mode: "0755"
    owner: root
    group: root
  become: true
  when: ansible_os_family == "RedHat"
  tags: [stella, vnc, audio]

- name: Install Stella audio capture script (Linux)
  ansible.builtin.copy:
    src: stella-audio-capture
    dest: /usr/local/bin/stella-audio-capture
    mode: "0755"
    owner: root
    group: root
  become: true
  when: ansible_os_family == "RedHat"
  tags: [stella, vnc, audio]

- name: Install Stella audio user service (Linux)
  ansible.builtin.copy:
    src: stella-audio.service
    dest: /usr/lib/systemd/user/stella-audio.service
    mode: "0644"
    owner: root
    group: root
  become: true
  when: ansible_os_family == "RedHat"
  tags: [stella, vnc, audio]

- name: Install Stella VNC xsession desktop entry
  ansible.builtin.copy:
    src: metacity-stella.desktop
    dest: "/usr/share/xsessions/{{ vnc_session_name }}.desktop"
    mode: "0644"
    owner: root
    group: root
  become: true
  when: ansible_os_family == "RedHat"
  tags: [stella, vnc]

- name: Ensure /etc/tigervnc exists
  ansible.builtin.file:
    path: /etc/tigervnc
    state: directory
    mode: "0755"
  become: true
  when: ansible_os_family == "RedHat"
  tags: [stella, vnc]

- name: Map VNC display to ec2-user
  ansible.builtin.copy:
    dest: /etc/tigervnc/vncserver.users
    mode: "0644"
    content: |
      # Managed by atari-keyboard ansible stella role
      {{ vnc_display }}={{ ansible_user_id }}
  become: true
  when: ansible_os_family == "RedHat"
  tags: [stella, vnc]

- name: Set TigerVNC defaults (session and geometry)
  ansible.builtin.copy:
    dest: /etc/tigervnc/vncserver-config-defaults
    mode: "0644"
    content: |
      # Managed by atari-keyboard ansible stella role
      session={{ vnc_session_name }}
      geometry={{ vnc_geometry }}
      securitytypes=vncauth
      alwaysshared
      localhost
  become: true
  when: ansible_os_family == "RedHat"
  notify: Restart TigerVNC
  tags: [stella, vnc]

- name: Force TigerVNC to listen on localhost only
  ansible.builtin.copy:
    dest: /etc/tigervnc/vncserver-config-mandatory
    mode: "0644"
    content: |
      # Managed by atari-keyboard ansible stella role.
      # Mandatory wins over ~/.config/tigervnc/config and ~/.vnc/config.
      # Reach the desktop with:
      #   ssh -L 5901:127.0.0.1:5901 ec2-user@HOST
      #   vnc://127.0.0.1:5901
      localhost
  become: true
  when: ansible_os_family == "RedHat"
  notify: Restart TigerVNC
  tags: [stella, vnc]

- name: Restore SELinux context on TigerVNC config
  ansible.builtin.command:
    cmd: >-
      restorecon -v
      /etc/tigervnc/vncserver-config-defaults
      /etc/tigervnc/vncserver-config-mandatory
  register: vnc_cfg_restorecon
  changed_when: >-
    'Relabeled' in (
      (vnc_cfg_restorecon.stdout | default(''))
      ~ (vnc_cfg_restorecon.stderr | default(''))
    )
  failed_when: false
  become: true
  when: ansible_os_family == "RedHat"
  notify: Restart TigerVNC
  tags: [stella, vnc]

- name: Require password file on Ansible controller
  ansible.builtin.stat:
    path: "{{ vnc_password_file }}"
  register: vnc_pw_stat
  delegate_to: localhost
  connection: local
  become: false
  when: ansible_os_family == "RedHat"
  tags: [stella, vnc]

- name: Fail when VNC password file is missing on controller
  ansible.builtin.fail:
    msg: >-
      VNC password file missing at {{ vnc_password_file }}.
      Create it (mode 600) with an 8-char password, outside git, e.g.
      mkdir -p ~/.config/atari-kickoff &&
      openssl rand -base64 6 | tr -d '/+=' | head -c 8 >
      ~/.config/atari-kickoff/vnc-password.txt &&
      chmod 600 ~/.config/atari-kickoff/vnc-password.txt
  when:
    - ansible_os_family == "RedHat"
    - not (vnc_pw_stat.stat.exists | default(false))
  tags: [stella, vnc]

- name: Ensure remote ~/.vnc directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.vnc"
    state: directory
    mode: "0700"
  when: ansible_os_family == "RedHat"
  tags: [stella, vnc]

- name: Encode VNC password on remote from controller secret
  ansible.builtin.shell: |
    set -euo pipefail
    printf '%s\n' "$VNC_PASS" | vncpasswd -f > "$HOME/.vnc/passwd"
    chmod 600 "$HOME/.vnc/passwd"
  environment:
    VNC_PASS: "{{ lookup('file', vnc_password_file) | trim }}"
  no_log: true
  changed_when: true
  when:
    - ansible_os_family == "RedHat"
    - vnc_pw_stat.stat.exists | default(false)
  tags: [stella, vnc]

- name: Restore SELinux context on ~/.vnc when enforcing
  ansible.builtin.command:
    cmd: restorecon -RFv {{ ansible_env.HOME }}/.vnc
  register: vnc_restorecon
  changed_when: "'Relabeled' in (vnc_restorecon.stdout | default(''))"
  failed_when: false
  when: ansible_os_family == "RedHat"
  tags: [stella, vnc]

- name: Enable lingering so PipeWire runs without an SSH login
  ansible.builtin.command:
    cmd: loginctl enable-linger {{ ansible_user_id }}
    creates: "/var/lib/systemd/linger/{{ ansible_user_id }}"
  become: true
  when: ansible_os_family == "RedHat"
  tags: [stella, vnc, audio]

- name: Ensure the user systemd manager is running
  ansible.builtin.systemd:
    name: "user@{{ ansible_user_uid }}.service"
    state: started
  become: true
  when: ansible_os_family == "RedHat"
  tags: [stella, vnc, audio]

- name: Enable and start PipeWire and the Stella sink
  ansible.builtin.shell: |
    set -euo pipefail
    uid=$(id -u)
    export XDG_RUNTIME_DIR="/run/user/${uid}"
    for _ in $(seq 1 25); do
      if [[ -S "${XDG_RUNTIME_DIR}/bus" ]]; then
        break
      fi
      sleep 0.2
    done
    if [[ ! -S "${XDG_RUNTIME_DIR}/bus" ]]; then
      echo "user bus missing at ${XDG_RUNTIME_DIR}/bus" >&2
      exit 1
    fi
    export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
    systemctl --user daemon-reload
    enable_out=$(systemctl --user enable \
      pipewire.socket \
      pipewire.service \
      pipewire-pulse.socket \
      pipewire-pulse.service \
      wireplumber.service \
      stella-audio.service 2>&1 || true)
    systemctl --user start \
      pipewire.socket \
      pipewire.service \
      pipewire-pulse.socket \
      pipewire-pulse.service \
      wireplumber.service \
      stella-audio.service
    printf '%s\n' "${enable_out}"
    systemctl --user --no-pager --full is-active \
      pipewire.service \
      pipewire-pulse.service \
      wireplumber.service \
      stella-audio.service
  args:
    executable: /bin/bash
  register: stella_audio_units
  changed_when: "'Created symlink' in (stella_audio_units.stdout | default(''))"
  when: ansible_os_family == "RedHat"
  tags: [stella, vnc, audio]

- name: Confirm the Stella PulseAudio sink
  ansible.builtin.shell: |
    set -euo pipefail
    export XDG_RUNTIME_DIR="/run/user/$(id -u)"
    export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
    pactl info
    echo "DEFAULT_SINK=$(pactl get-default-sink)"
  args:
    executable: /bin/bash
  register: stella_pactl
  changed_when: false
  failed_when: >-
    'PipeWire' not in (stella_pactl.stdout | default(''))
    or ('DEFAULT_SINK=' ~ stella_audio_sink) not in (stella_pactl.stdout | default(''))
  when: ansible_os_family == "RedHat"
  tags: [stella, vnc, audio]

- name: Show PipeWire sink status
  ansible.builtin.debug:
    var: stella_pactl.stdout_lines
  when:
    - ansible_os_family == "RedHat"
    - stella_pactl is defined
  tags: [stella, vnc, audio]

- name: Enable and start TigerVNC on display {{ vnc_display }}
  ansible.builtin.systemd:
    name: "vncserver@{{ vnc_display }}.service"
    enabled: true
    state: started
    daemon_reload: true
  become: true
  when: ansible_os_family == "RedHat"
  tags: [stella, vnc]

- name: Report VNC endpoint
  ansible.builtin.debug:
    msg: >-
      TigerVNC display {{ vnc_display }} listens on 127.0.0.1:{{ vnc_port }}
      only. Tunnel from your machine, then connect to vnc://127.0.0.1:{{ vnc_port }}:
      ssh -i {{ ansible_ssh_private_key_file | default('~/.ssh/neo-atari.pem') }}
      -L {{ vnc_port }}:127.0.0.1:{{ vnc_port }}
      {{ ansible_user }}@{{ ansible_host | default(inventory_hostname) }}.
      Password file on controller: {{ vnc_password_file }}.
      Inside the session, launch Stella with stella-flatpak
      (software video; PipeWire pulse sink {{ stella_audio_sink }}
      when the sound server is up, otherwise silent). Keymap DB:
      ~/.var/app/{{ stella_flatpak_id }}/config/stella/stella.sqlite3
  when: ansible_os_family == "RedHat"
  tags: [stella, vnc]
